<main><h1>#547 界面预览</h1><p class="m">commit ee37975 · <a href="https://github.com/yetone/magpie/pull/547">回到 PR</a> · 这次 diff 里只有两处真正落到界面上：路由页的帧循环不再在页面隐藏时继续调度（切到别的标签、窗口被盖住时停下，重新显示/聚焦时恢复），以及「用量」页与面板「用量」标签的刷新被串行化——同一时刻只有一个请求，期间的周期切换、供应方选择和「立即刷新」会被排队并在这次读完后补上。其余改动（网关请求体积与队列上限、用量索引与摘要缓存、插件刷新超时重试）都在后端，界面本身没有新增元素。</p>
